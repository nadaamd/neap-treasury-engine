# ==========================================================================
# SECRETS — released by the Vault DON directly into the attested enclave
# ==========================================================================
# They are never exposed in cleartext to node operators, nor to the memory of
# the Workflow DON nodes.
#
# NEAP uses two of the eleven allowed per invocation.
secretsNames:
    # Treasury API access token. What it protects is not itself: it is the API
    # response — live balances, commitments, internal limits.
    TREASURY_API_TOKEN:
        - SECRET_TREASURY_API_TOKEN
    # Commitment salt seed. The handler is a pure function with no randomness;
    # the salt must nonetheless stay unpredictable to an observer, otherwise the
    # space of quantised plans can be walked by brute force.
    COMMITMENT_SALT_SEED:
        - SECRET_COMMITMENT_SALT_SEED
