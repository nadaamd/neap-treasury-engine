# ==========================================================================
# SECRETS — libérés par le Vault DON directement dans l'enclave attestée
# ==========================================================================
# Ils ne sont jamais exposés en clair aux opérateurs de nœuds ni à la mémoire
# des nœuds du Workflow DON.
#
# NEAP en utilise deux, sur les onze autorisés par invocation.
secretsNames:
    # Jeton d'accès à l'API de trésorerie. Ce qu'il protège n'est pas lui-même :
    # c'est la réponse de l'API — soldes vivants, engagements, limites internes.
    TREASURY_API_TOKEN:
        - SECRET_TREASURY_API_TOKEN
    # Graine du sel d'engagement. Le handler est une fonction pure et n'a pas
    # d'aléa ; le sel doit pourtant rester imprévisible pour un observateur,
    # sinon l'espace des plans quantifiés se parcourt par force brute.
    COMMITMENT_SALT_SEED:
        - SECRET_COMMITMENT_SALT_SEED
