[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# License and code-size warnings are errors: in a repository meant to be read by judges,
# a noisy build costs more than it is worth.
deny = "warnings"

# Read-only, and strictly on the conformance fixture folder. Foundry closes filesystem
# access by default, and that is a good thing: a test that can read anything can also
# exfiltrate anything. We open the minimum.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
# Production code is treated strictly: every warning is an error.
# Tests are excluded from the linter, because their conventions legitimately differ —
# ignoring the return value of a call whose revert is the only thing under test is not a
# defect, it is the point of the test.
ignore = ["**/*.t.sol"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
