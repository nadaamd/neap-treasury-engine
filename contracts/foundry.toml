[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Les avertissements de licence et de taille de code sont des erreurs : sur un dépôt
# destiné à être lu par des juges, un build bruyant coûte plus cher qu'il ne rapporte.
deny = "warnings"

# Lecture seule, et strictement sur le dossier du jeu de conformité. Foundry ferme
# l'accès au système de fichiers par défaut, et c'est une bonne chose : un test qui peut
# lire n'importe quoi peut aussi exfiltrer n'importe quoi. On ouvre le minimum.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
# Le code de production est traité en strict : tout avertissement est une erreur.
# Les tests sont exclus du linter, parce que leurs conventions diffèrent légitimement —
# ignorer la valeur de retour d'un appel dont on ne teste que la révocation n'est pas un
# défaut, c'est le propos du test.
ignore = ["**/*.t.sol"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
